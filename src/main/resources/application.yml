spring:
  application:
    name: ledger-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger_service}
    username: ${DB_USER:ledger_service}
    password: ${DB_PASSWORD:ledger_service}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledger-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.incentivepay.ledger.messaging
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.incentivepay.ledger.messaging.DisbursementCompletedEvent

  security:
    oauth2:
      resourceserver:
        jwt:
          # See incentive-api's application.yml for why jwk-set-uri, not issuer-uri.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/incentivepay/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8082}

incentivepay:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.incentivepay: INFO
